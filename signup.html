<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    JusticeAI • Create Account
  </title>


  <!-- FONT -->

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >


  <style>

  /* =========================
     BASE
  ========================== */

  *{
    margin:0;
    padding:0;
    box-sizing:border-box;
  }

  body{

    font-family:'Poppins',sans-serif;

    background:#050816;

    color:white;

    overflow:hidden;

  }


  /* =========================
     UNIVERSE
  ========================== */

  #universe{

    position:fixed;

    inset:0;

    z-index:-5;

    background:
    radial-gradient(
      circle at center,
      #090b1d,
      #02030a
    );

  }


  /* =========================
     WRAPPER
  ========================== */

  .signup-wrapper{

    min-height:100vh;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:20px;

  }


  /* =========================
     CARD
  ========================== */

  .signup-card{

    width:100%;

    max-width:520px;

    padding:42px;

    border-radius:34px;

    background:
    linear-gradient(
      135deg,
      rgba(13,16,32,.94),
      rgba(20,24,58,.94)
    );

    border:
    1px solid rgba(255,255,255,.08);

    backdrop-filter:blur(14px);

    box-shadow:
    0 10px 40px rgba(0,0,0,.28);

  }


  /* =========================
     TOP
  ========================== */

  .signup-top{

    text-align:center;

    margin-bottom:34px;

  }

  .signup-logo{

    width:90px;

    height:90px;

    margin:auto;

    margin-bottom:20px;

    border-radius:26px;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:42px;

    background:
    rgba(127,124,255,.14);

    border:
    1px solid rgba(255,255,255,.08);

  }

  .signup-top h1{

    font-size:42px;

    margin-bottom:12px;

    background:
    linear-gradient(
      90deg,
      #7f7cff,
      #ff6fd8
    );

    -webkit-background-clip:text;

    -webkit-text-fill-color:transparent;

  }

  .signup-top p{

    color:#cfd3ff;

    line-height:1.8;

  }


  /* =========================
     FORM
  ========================== */

  .input-box{

    margin-bottom:18px;

  }

  .input-box label{

    display:block;

    margin-bottom:10px;

    color:#d7dbff;

    font-size:14px;

  }

  .input-box input{

    width:100%;

    padding:
    16px 18px;

    border:none;

    outline:none;

    border-radius:18px;

    background:
    rgba(255,255,255,.04);

    border:
    1px solid rgba(255,255,255,.06);

    color:white;

    font-size:15px;

  }


  /* =========================
     TERMS
  ========================== */

  .terms{

    margin:
    10px 0 24px;

    color:#cfd3ff;

    font-size:14px;

    line-height:1.7;

  }

  .terms a{

    color:#7f7cff;

    text-decoration:none;

  }


  /* =========================
     BUTTON
  ========================== */

  .signup-btn{

    width:100%;

    padding:
    16px;

    border:none;

    border-radius:18px;

    cursor:pointer;

    color:white;

    font-size:16px;

    font-weight:600;

    background:
    linear-gradient(
      135deg,
      #7f7cff,
      #ff6fd8
    );

    box-shadow:
    0 10px 25px rgba(127,124,255,.24);

    transition:.3s;

  }

  .signup-btn:hover{

    transform:
    translateY(-2px);

  }


  /* =========================
     SOCIAL
  ========================== */

  .divider{

    text-align:center;

    margin:
    28px 0;

    position:relative;

    color:#9fa8dc;

  }

  .divider::before,
  .divider::after{

    content:"";

    position:absolute;

    top:50%;

    width:38%;

    height:1px;

    background:
    rgba(255,255,255,.08);

  }

  .divider::before{

    left:0;

  }

  .divider::after{

    right:0;

  }

  .social-buttons{

    display:flex;

    gap:16px;

  }

  .social-btn{

    flex:1;

    padding:
    14px;

    border-radius:16px;

    text-align:center;

    cursor:pointer;

    background:
    rgba(255,255,255,.04);

    border:
    1px solid rgba(255,255,255,.06);

    transition:.3s;

  }

  .social-btn:hover{

    background:
    rgba(127,124,255,.12);

  }


  /* =========================
     FOOTER
  ========================== */

  .signup-footer{

    margin-top:28px;

    text-align:center;

    color:#cfd3ff;

    font-size:14px;

  }

  .signup-footer a{

    color:#7f7cff;

    text-decoration:none;

  }


  /* =========================
     RESPONSIVE
  ========================== */

  @media(max-width:600px){

    .signup-card{

      padding:30px;

    }

    .signup-top h1{

      font-size:34px;

    }

    .social-buttons{

      flex-direction:column;

    }

  }

  </style>

</head>

<body>


  <!-- =========================
       UNIVERSE
  ========================== -->

  <canvas id="universe"></canvas>


  <!-- =========================
       SIGNUP
  ========================== -->

  <div class="signup-wrapper">


    <div class="signup-card">


      <!-- TOP -->

      <div class="signup-top">

        <div class="signup-logo">

          ⚖️

        </div>

        <h1>

          Create Account

        </h1>

        <p>

          Join JusticeAI and explore
          AI-powered legal awareness,
          learning and legal assistance.

        </p>

      </div>


      <!-- FORM -->

      <div class="input-box">

        <label>

          Full Name

        </label>

        <input
          type="text"
          placeholder="Enter full name"
        >

      </div>


      <div class="input-box">

        <label>

          Email Address

        </label>

        <input
          type="email"
          placeholder="Enter email address"
        >

      </div>


      <div class="input-box">

        <label>

          Password

        </label>

        <input
          type="password"
          placeholder="Create password"
        >

      </div>


      <div class="input-box">

        <label>

          Confirm Password

        </label>

        <input
          type="password"
          placeholder="Confirm password"
        >

      </div>


      <!-- TERMS -->

      <div class="terms">

        <label>

          <input type="checkbox">

          I agree to the
          <a href="#">

            Terms & Conditions

          </a>

          and Privacy Policy.

        </label>

      </div>


      <!-- BUTTON -->

      <button class="signup-btn">

        Create JusticeAI Account

      </button>


      <!-- DIVIDER -->

      <div class="divider">

        OR SIGNUP WITH

      </div>


      <!-- SOCIAL -->

      <div class="social-buttons">

        <div class="social-btn">

          🔵 Google

        </div>

        <div class="social-btn">

          ⚫ GitHub

        </div>

      </div>


      <!-- FOOTER -->

      <div class="signup-footer">

        Already have an account?

        <a href="login.html">

          Login

        </a>

      </div>

    </div>

  </div>


  <!-- =========================
       SCRIPT
  ========================== -->

  <script>

    const canvas =
    document.getElementById("universe");

    const ctx =
    canvas.getContext("2d");

    let stars=[];

    let w,h;

    function resize(){

      w =
      canvas.width =
      window.innerWidth;

      h =
      canvas.height =
      window.innerHeight;

    }

    resize();

    window.addEventListener(
      "resize",
      resize
    );


    for(let i=0;i<450;i++){

      stars.push({

        x:Math.random()*w,

        y:Math.random()*h,

        z:Math.random()*1.2+.2,

        r:Math.random()*1.5+.3

      });

    }


    function animate(){

      ctx.clearRect(0,0,w,h);

      stars.forEach(s=>{

        s.y += s.z;

        if(s.y > h){

          s.y = 0;

          s.x = Math.random()*w;

        }

        ctx.beginPath();

        ctx.arc(
          s.x,
          s.y,
          s.r,
          0,
          Math.PI*2
        );

        ctx.fillStyle =
        "rgba(127,124,255,.9)";

        ctx.shadowBlur = 15;

        ctx.shadowColor =
        "#7f7cff";

        ctx.fill();

      });

      requestAnimationFrame(
        animate
      );

    }

    animate();

  </script>

</body>
</html>
