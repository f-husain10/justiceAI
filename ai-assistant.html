<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    JusticeAI • AI Assistant
  </title>


  <!-- FONT -->

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >


  <style>

  /* =========================
     BASE
  ========================== */

  *{
    margin:0;
    padding:0;
    box-sizing:border-box;
  }

  body{

    font-family:'Poppins',sans-serif;

    background:#050816;

    color:white;

    overflow:hidden;

  }


  /* =========================
     UNIVERSE
  ========================== */

  #universe{

    position:fixed;

    inset:0;

    z-index:-5;

    background:
    radial-gradient(
      circle at center,
      #090b1d,
      #02030a
    );

  }


  /* =========================
     NAVBAR
  ========================== */

  .navbar{

    width:100%;

    padding:20px 60px;

    display:flex;

    justify-content:space-between;

    align-items:center;

    position:sticky;

    top:0;

    z-index:100;

    background:
    rgba(8,10,22,.75);

    backdrop-filter:blur(16px);

    border-bottom:
    1px solid rgba(255,255,255,.06);

  }

  .nav-logo{

    font-size:1.7rem;

    font-weight:700;

    background:
    linear-gradient(
      90deg,
      #7f7cff,
      #ff6fd8
    );

    -webkit-background-clip:text;

    -webkit-text-fill-color:transparent;

  }

  .nav-links{

    display:flex;

    gap:28px;

  }

  .nav-links a{

    color:#d7dbff;

    text-decoration:none;

  }


  /* =========================
     PAGE
  ========================== */

  .chat-wrapper{

    height:
    calc(100vh - 85px);

    padding:30px;

    display:flex;

    flex-direction:column;

  }


  /* =========================
     CHAT BOX
  ========================== */

  .chat-box{

    flex:1;

    overflow-y:auto;

    padding:24px;

    border-radius:30px;

    background:
    linear-gradient(
      135deg,
      rgba(13,16,32,.94),
      rgba(20,24,58,.94)
    );

    border:
    1px solid rgba(255,255,255,.08);

    box-shadow:
    0 10px 40px rgba(0,0,0,.28);

  }


  /* =========================
     MESSAGE
  ========================== */

  .message{

    max-width:75%;

    padding:
    18px 22px;

    margin-bottom:18px;

    border-radius:22px;

    line-height:1.8;

    animation:fade .3s ease;

  }

  .user{

    margin-left:auto;

    background:
    linear-gradient(
      135deg,
      #7f7cff,
      #9c6bff
    );

  }

  .ai{

    background:
    rgba(255,255,255,.05);

    border:
    1px solid rgba(255,255,255,.06);

  }

  @keyframes fade{

    from{

      opacity:0;
      transform:translateY(10px);

    }

    to{

      opacity:1;
      transform:translateY(0);

    }

  }


  /* =========================
     TYPING
  ========================== */

  .typing{

    display:flex;

    gap:8px;

    align-items:center;

  }

  .dot{

    width:10px;

    height:10px;

    border-radius:50%;

    background:#7f7cff;

    animation:bounce 1s infinite;

  }

  .dot:nth-child(2){

    animation-delay:.2s;

  }

  .dot:nth-child(3){

    animation-delay:.4s;

  }

  @keyframes bounce{

    0%,80%,100%{

      transform:scale(.7);

      opacity:.5;

    }

    40%{

      transform:scale(1);

      opacity:1;

    }

  }


  /* =========================
     INPUT AREA
  ========================== */

  .input-area{

    display:flex;

    gap:16px;

    margin-top:20px;

  }

  .input-area input{

    flex:1;

    padding:
    18px 22px;

    border:none;

    outline:none;

    border-radius:20px;

    background:
    rgba(255,255,255,.05);

    border:
    1px solid rgba(255,255,255,.06);

    color:white;

    font-size:15px;

  }

  .send-btn{

    padding:
    18px 28px;

    border:none;

    border-radius:20px;

    cursor:pointer;

    color:white;

    font-size:15px;

    font-weight:600;

    background:
    linear-gradient(
      135deg,
      #7f7cff,
      #ff6fd8
    );

    box-shadow:
    0 10px 25px rgba(127,124,255,.24);

  }


  /* =========================
     RESPONSIVE
  ========================== */

  @media(max-width:700px){

    .navbar{

      padding:18px 24px;

    }

    .chat-wrapper{

      padding:20px;

    }

    .message{

      max-width:92%;

    }

  }

  </style>

</head>

<body>


  <!-- =========================
       UNIVERSE
  ========================== -->

  <canvas id="universe"></canvas>


  <!-- =========================
       NAVBAR
  ========================== -->

  <div class="navbar">

    <div class="nav-logo">

      ⚖️ JusticeAI

    </div>

    <div class="nav-links">

      <a href="index.html">
        Home
      </a>

      <a href="#">
        AI Assistant
      </a>

      <a href="#">
        Legal Chat
      </a>

    </div>

  </div>


  <!-- =========================
       CHAT
  ========================== -->

  <div class="chat-wrapper">


    <!-- CHAT BOX -->

    <div
      class="chat-box"
      id="chatBox"
    >


      <!-- AI -->

      <div class="message ai">

        👋 Hello! I am JusticeAI.
        Ask me about cybercrime,
        FIRs, consumer rights,
        cyber safety or legal awareness.

      </div>

    </div>


    <!-- INPUT -->

    <div class="input-area">

      <input
        type="text"
        id="userInput"
        placeholder="Ask your legal question..."
      >

      <button
        class="send-btn"
        onclick="sendMessage()"
      >

        Send

      </button>

    </div>

  </div>


  <!-- =========================
       SCRIPT
  ========================== -->

  <script>

    /* =========================
       CHAT SYSTEM
    ========================== */

    const chatBox =
    document.getElementById(
      "chatBox"
    );

    const input =
    document.getElementById(
      "userInput"
    );


    function sendMessage(){

      const text =
      input.value.trim();

      if(text === "") return;


      /* USER MESSAGE */

      const userMsg =
      document.createElement("div");

      userMsg.className =
      "message user";

      userMsg.innerHTML = text;

      chatBox.appendChild(userMsg);


      /* CLEAR INPUT */

      input.value = "";


      /* TYPING */

      const typing =
      document.createElement("div");

      typing.className =
      "message ai";

      typing.innerHTML =
      `
      <div class="typing">

        <div class="dot"></div>

        <div class="dot"></div>

        <div class="dot"></div>

      </div>
      `;

      chatBox.appendChild(
        typing
      );

      chatBox.scrollTop =
      chatBox.scrollHeight;


      /* AI RESPONSE */

      setTimeout(()=>{

        typing.remove();

        const aiMsg =
        document.createElement("div");

        aiMsg.className =
        "message ai";


        let response =
        "Please consult a legal expert for detailed assistance.";


        const q =
        text.toLowerCase();


        if(q.includes("cyber")){

          response =
          "Cybercrime complaints can be reported through the National Cyber Crime Portal or helpline 1930.";

        }

        else if(q.includes("fir")){

          response =
          "An FIR is a First Information Report filed at a police station for reporting cognizable offences.";

        }

        else if(q.includes("rights")){

          response =
          "Fundamental Rights are protected by the Constitution of India and ensure equality and freedom.";

        }

        else if(q.includes("consumer")){

          response =
          "Consumers can file complaints under the Consumer Protection Act for unfair trade practices.";

        }

        else if(q.includes("women")){

          response =
          "Women protection laws include Domestic Violence Act, POSH Act and IPC legal protections.";

        }


        aiMsg.innerHTML =
        `🤖 ${response}`;

        chatBox.appendChild(
          aiMsg
        );

        chatBox.scrollTop =
        chatBox.scrollHeight;

      },1500);

    }


    /* ENTER KEY */

    input.addEventListener(
      "keypress",
      e=>{

        if(e.key === "Enter"){

          sendMessage();

        }

      }
    );


    /* =========================
       UNIVERSE
    ========================== */

    const canvas =
    document.getElementById("universe");

    const ctx =
    canvas.getContext("2d");

    let stars=[];

    let w,h;

    function resize(){

      w =
      canvas.width =
      window.innerWidth;

      h =
      canvas.height =
      window.innerHeight;

    }

    resize();

    window.addEventListener(
      "resize",
      resize
    );


    for(let i=0;i<450;i++){

      stars.push({

        x:Math.random()*w,

        y:Math.random()*h,

        z:Math.random()*1.2+.2,

        r:Math.random()*1.5+.3

      });

    }


    function animate(){

      ctx.clearRect(0,0,w,h);

      stars.forEach(s=>{

        s.y += s.z;

        if(s.y > h){

          s.y = 0;

          s.x = Math.random()*w;

        }

        ctx.beginPath();

        ctx.arc(
          s.x,
          s.y,
          s.r,
          0,
          Math.PI*2
        );

        ctx.fillStyle =
        "rgba(127,124,255,.9)";

        ctx.shadowBlur = 15;

        ctx.shadowColor =
        "#7f7cff";

        ctx.fill();

      });

      requestAnimationFrame(
        animate
      );

    }

    animate();

  </script>

</body>
</html>
