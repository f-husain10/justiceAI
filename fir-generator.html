<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    JusticeAI • FIR Generator
  </title>


  <!-- FONT -->

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >


  <style>

  /* =========================
     BASE
  ========================== */

  *{
    margin:0;
    padding:0;
    box-sizing:border-box;
  }

  body{

    font-family:'Poppins',sans-serif;

    background:#050816;

    color:white;

    overflow-x:hidden;

  }


  /* =========================
     UNIVERSE
  ========================== */

  #universe{

    position:fixed;

    inset:0;

    z-index:-5;

    background:
    radial-gradient(
      circle at center,
      #090b1d,
      #02030a
    );

  }


  /* =========================
     NAVBAR
  ========================== */

  .navbar{

    width:100%;

    padding:20px 60px;

    display:flex;

    justify-content:space-between;

    align-items:center;

    position:sticky;

    top:0;

    z-index:100;

    background:
    rgba(8,10,22,.75);

    backdrop-filter:blur(16px);

    border-bottom:
    1px solid rgba(255,255,255,.06);

  }

  .nav-logo{

    font-size:1.7rem;

    font-weight:700;

    background:
    linear-gradient(
      90deg,
      #7f7cff,
      #ff6fd8
    );

    -webkit-background-clip:text;

    -webkit-text-fill-color:transparent;

  }

  .nav-links{

    display:flex;

    gap:28px;

  }

  .nav-links a{

    color:#d7dbff;

    text-decoration:none;

  }


  /* =========================
     HERO
  ========================== */

  .hero{

    text-align:center;

    padding:
    100px 20px 70px;

  }

  .hero-pill{

    display:inline-block;

    padding:
    10px 18px;

    border-radius:999px;

    background:
    rgba(127,124,255,.16);

    border:
    1px solid rgba(255,255,255,.06);

    color:#d7dbff;

    font-size:13px;

  }

  .hero h1{

    font-size:72px;

    margin:
    24px 0 18px;

    line-height:1;

    background:
    linear-gradient(
      90deg,
      #7f7cff,
      #ff6fd8
    );

    -webkit-background-clip:text;

    -webkit-text-fill-color:transparent;

  }

  .hero p{

    max-width:760px;

    margin:auto;

    line-height:1.9;

    color:#cfd3ff;

    font-size:17px;

  }


  /* =========================
     WRAPPER
  ========================== */

  .wrapper{

    display:grid;

    grid-template-columns:
    1fr 1fr;

    gap:30px;

    padding:
    20px 60px 80px;

  }


  /* =========================
     CARD
  ========================== */

  .card{

    padding:34px;

    border-radius:32px;

    background:
    linear-gradient(
      135deg,
      rgba(13,16,32,.92),
      rgba(20,24,58,.92)
    );

    border:
    1px solid rgba(255,255,255,.08);

    backdrop-filter:blur(14px);

    box-shadow:
    0 10px 35px rgba(0,0,0,.25);

  }


  /* =========================
     FORM
  ========================== */

  .card h2{

    margin-bottom:26px;

    font-size:28px;

  }

  .input-box{

    margin-bottom:18px;

  }

  .input-box label{

    display:block;

    margin-bottom:10px;

    color:#d7dbff;

    font-size:14px;

  }

  .input-box input,
  .input-box textarea{

    width:100%;

    padding:
    16px 18px;

    border:none;

    outline:none;

    border-radius:18px;

    background:
    rgba(255,255,255,.04);

    border:
    1px solid rgba(255,255,255,.06);

    color:white;

    font-size:15px;

  }

  textarea{

    resize:none;

    min-height:140px;

  }


  /* =========================
     BUTTON
  ========================== */

  .generate-btn{

    width:100%;

    padding:
    16px;

    border:none;

    border-radius:18px;

    cursor:pointer;

    color:white;

    font-size:15px;

    font-weight:600;

    background:
    linear-gradient(
      135deg,
      #7f7cff,
      #ff6fd8
    );

    box-shadow:
    0 10px 25px rgba(127,124,255,.24);

  }


  /* =========================
     OUTPUT
  ========================== */

  .output-box{

    line-height:1.9;

    color:#d2d7ff;

    white-space:pre-line;

  }

  .placeholder{

    color:#8d95c9;

  }


  /* =========================
     RESPONSIVE
  ========================== */

  @media(max-width:900px){

    .wrapper{

      grid-template-columns:1fr;

    }

  }

  @media(max-width:700px){

    .navbar{

      padding:18px 24px;

    }

    .hero h1{

      font-size:52px;

    }

    .wrapper{

      padding:
      20px 24px 50px;

    }

  }

  </style>

</head>

<body>


  <!-- =========================
       UNIVERSE
  ========================== -->

  <canvas id="universe"></canvas>


  <!-- =========================
       NAVBAR
  ========================== -->

  <div class="navbar">

    <div class="nav-logo">

      ⚖️ JusticeAI

    </div>

    <div class="nav-links">

      <a href="index.html">
        Home
      </a>

      <a href="#">
        FIR Generator
      </a>

      <a href="#">
        AI Drafting
      </a>

    </div>

  </div>


  <!-- =========================
       HERO
  ========================== -->

  <div class="hero">

    <span class="hero-pill">

      📄 AI Legal Document Generator

    </span>

    <h1>

      AI FIR
      Generator

    </h1>

    <p>

      Generate professional FIR drafts
      instantly for cybercrime, fraud,
      theft and other legal complaints.

    </p>

  </div>


  <!-- =========================
       WRAPPER
  ========================== -->

  <div class="wrapper">


    <!-- FORM -->

    <div class="card">

      <h2>

        Enter FIR Details

      </h2>


      <div class="input-box">

        <label>

          Full Name

        </label>

        <input
          type="text"
          id="name"
          placeholder="Enter your name"
        >

      </div>


      <div class="input-box">

        <label>

          Incident Type

        </label>

        <input
          type="text"
          id="incident"
          placeholder="Example: Cyber Fraud"
        >

      </div>


      <div class="input-box">

        <label>

          Incident Date

        </label>

        <input
          type="date"
          id="date"
        >

      </div>


      <div class="input-box">

        <label>

          Incident Description

        </label>

        <textarea
          id="description"
          placeholder="Describe the incident..."
        ></textarea>

      </div>


      <button
        class="generate-btn"
        onclick="generateFIR()"
      >

        Generate FIR Draft

      </button>

    </div>


    <!-- OUTPUT -->

    <div class="card">

      <h2>

        AI Generated FIR

      </h2>

      <div
        class="output-box"
        id="output"
      >

        <span class="placeholder">

          Your AI-generated FIR draft
          will appear here...

        </span>

      </div>

    </div>

  </div>


  <!-- =========================
       SCRIPT
  ========================== -->

  <script>

    /* =========================
       FIR GENERATOR
    ========================== */

    function generateFIR(){

      const name =
      document.getElementById("name").value;

      const incident =
      document.getElementById("incident").value;

      const date =
      document.getElementById("date").value;

      const description =
      document.getElementById("description").value;

      const output =
      document.getElementById("output");

      output.innerHTML =

      `
To,
The Station House Officer

Subject: FIR Regarding ${incident}

Respected Sir/Madam,

I, ${name}, would like to report an incident related to ${incident} that occurred on ${date}.

Incident Details:
${description}

I kindly request you to register my complaint and take necessary legal action regarding this matter.

Thank You,

Applicant Name:
${name}

Generated by JusticeAI
      `;

    }


    /* =========================
       UNIVERSE
    ========================== */

    const canvas =
    document.getElementById("universe");

    const ctx =
    canvas.getContext("2d");

    let stars=[];

    let w,h;

    function resize(){

      w =
      canvas.width =
      window.innerWidth;

      h =
      canvas.height =
      window.innerHeight;

    }

    resize();

    window.addEventListener(
      "resize",
      resize
    );


    for(let i=0;i<450;i++){

      stars.push({

        x:Math.random()*w,

        y:Math.random()*h,

        z:Math.random()*1.2+.2,

        r:Math.random()*1.5+.3

      });

    }


    function animate(){

      ctx.clearRect(0,0,w,h);

      stars.forEach(s=>{

        s.y += s.z;

        if(s.y > h){

          s.y = 0;

          s.x = Math.random()*w;

        }

        ctx.beginPath();

        ctx.arc(
          s.x,
          s.y,
          s.r,
          0,
          Math.PI*2
        );

        ctx.fillStyle =
        "rgba(127,124,255,.9)";

        ctx.shadowBlur = 15;

        ctx.shadowColor =
        "#7f7cff";

        ctx.fill();

      });

      requestAnimationFrame(
        animate
      );

    }

    animate();

  </script>

</body>
</html>
